<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Private fontconfig for QA renders only. Used through FONTCONFIG_FILE by deck/qa/render.py;
  it does not include /etc/fonts/conf.d or the user's ~/.config/fontconfig, and changes nothing there.

  The deck names its real fonts (docs/DESIGN.md): Fira Sans, Fira Sans Medium, Fira Sans SemiBold, Fira Mono,
  Fira Mono Medium. deck/qa/fonts/ holds those exact OFL files (deck/qa/setup_fonts.py), so no substitution is
  configured. /usr/share/fonts stays readable only for glyph fallback (for example the emoji on slide 1).
-->
<fontconfig>
  <dir prefix="relative">fonts</dir>
  <dir>/usr/share/fonts</dir>
  <cachedir prefix="relative">../out/.fccache</cachedir>

  <!-- generic families only (LibreOffice defaults and glyph fallback), no font aliases -->
  <alias><family>sans-serif</family><prefer><family>Fira Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Fira Mono</family></prefer></alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
