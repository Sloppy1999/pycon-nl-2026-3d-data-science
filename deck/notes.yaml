  - 'keys.append(k); pts.append(xyz[first]): keep only those, the rest of the chunk is freed'
  - 'k, first = np.unique(np.concatenate(keys), return_index=True): merge the chunks; a voxel split over two chunks keeps
    its first occurrence'
  - 'points = np.concatenate(pts)[first]: the result, one real point per voxel; the earliest chunk wins'

