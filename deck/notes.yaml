- n: 10
  seconds: 70
  ends_at: '8:55'
  talk_track: 'The chain works because Python passes whole arrays, not points, and every hand-off is either a copy or a
    view. The legend is the one idea: a copy is new memory, two names on two blocks, so it costs time and RAM, and changing
    one leaves the other alone. A view is two names on one block: free, but a write through one shows up in the other. las.xyz
    builds a brand-new array every time you touch it, so name it once. Vector3dVector always copies, and given float32 it
    takes a slow path, {facts.factor_v3d_float32_vs_float64_f.median|x} slower. On the way back, np.asarray(pcd.points)
    is a writeable view, and PyVista''s PolyData shares that same memory. Why it matters: every xyz copy is {memory.tile_1km.bytes_per_point.xyz_float64|int}
    bytes per point, half a gigabyte for one 1 km AHN file. Now, the six steps.'
  question: Why does Vector3dVector copy at all?
  answer: 'Open3D keeps its points in its own C++ vector, which is what the name says, so it has to own that memory; np.asarray
    on the way back is a view into it, which is why writes reach the cloud. The fast way in is a C-ordered float64 array:
    {facts.timings.v3d_float64_c.median_ms|ms}, against {facts.timings.v3d_float64_f.median_ms|ms} for laspy''s column-ordered
    one and {facts.timings.v3d_float32.median_ms|ms} for float32.'
  skip: 'Skip-first number 5 (decide at the end of slide 9). If skipped, say on slide 11: "between the libraries Python
    passes whole arrays; Vector3dVector copies, np.asarray gives you a view".'
  trace:
  - 'bench/python_facts.py (copy or view: write to one side, read the other, and np.shares_memory; timings 1 warm-up and
    7 runs, median and IQR, idle check)'
  - 'results/python_facts.json: las_xyz.fresh_copy_each_access, las_xyz.f_contiguous, vector3dvector.copies, asarray_points.view,
    asarray_points.writeable, polydata.shares_memory_open3d_view, polydata.shares_memory_c_float64, timings.*, factor_v3d_float32_vs_float64_f,
    conditions'
  - 'snippets/s06b_handoffs.py (the four calls on the crop, with asserts); results/snippets.json: s06b_handoffs.py.ok'
  - pv.PolyData of laspy's F-ordered array does not share memory (results/python_facts.json polydata.shares_memory_f_float64);
    the slide's pts is Open3D's C-ordered view
  - Candidate gotchas 'las.xyz' and 'Vector3dVector(float32)' on slide 29 are measured here
  why_it_matters:
  - 'Memory: one float64 xyz copy is {memory.tile_1km.bytes_per_point.xyz_float64|int} B per point (results/memory.json);
    21 013 926 points × 24 B = 0.47 GB per copy of a 1 km AHN file, and the load-everything pipeline holds several (slide
    25)'
  - 'Time: copying the crop into Open3D takes {facts.timings.v3d_float64_c.median_ms|ms} from a C-ordered float64 array,
    {facts.timings.v3d_float64_f.median_ms|ms} from laspy''s column-ordered one and {facts.timings.v3d_float32.median_ms|ms}
    from float32; np.asarray(pcd.points) takes {facts.timings.asarray_points.median_ms|ms}, because it copies nothing'
  - 'Correctness: a write through a view changes the point cloud behind it (np.asarray(pcd.points) -= origin moves Open3D''s
    points); a write to a copy is silently lost (las.xyz[:] = 0 changes nothing in the file data)'
  - 'Rule of thumb: name an array once, pass it on, and copy only on purpose (astype, np.ascontiguousarray)'

- n: 11
  seconds: 25
  ends_at: '9:20'
  talk_track: 'Six steps turn this point cloud into labels: load, voxel downsampling, ground removal, clustering, labelling
    and visualisation. It''s the same area and the same camera in every frame, so you can watch it change from slide to
    slide. Let''s start with step one.'
  question: Why remove the ground before clustering?
  answer: 'Because DBSCAN groups whatever touches, and the ground touches everything: left in, it would link the whole scene
    together through the road. That is reasoning; I didn''t benchmark the other order.'
  trace:
  - renders/f1_load.png, f2_voxel.png, f3_ground.png, f4_clusters.png, f5_labels.png, f6_final.png
  - renders/render_spec.json (one camera for all frames)
  why_several_tools_in_one_step:
  - No library has a fast, batched call for every part of a step, so each part goes to the library that has one; because
    they all take and give NumPy arrays (slide 10), mixing them costs at most one copy
  - 'Clustering, Open3D and SciPy: DBSCAN is Open3D''s cluster_dbscan, but first SciPy''s KDTree answers ''how high is each
    voxel above the ground?'' (height_above, one query on all cores), so only voxels clearly above the ground go into DBSCAN;
    left in, the ground would link the whole scene into one cluster'
  - 'Labelling, NumPy and SciPy: NumPy computes every cluster''s features at once with np.bincount over the cluster ids
    (top height, footprint, share of multiple returns); SciPy''s KDTree gives each cluster its distance to the nearest building
    and tree for rules 3 and 4 (facade, free-standing)'
  - 'Visualisation, SciPy and PyVista: SciPy''s KDTree paints the labels from the {pipeline.points_after_voxel|int} voxels
    back onto all {pipeline.points_in|int} points in one query; PyVista then renders them off-screen'
  - Load and ground removal use one library each for the work (laspy, Open3D), with NumPy for the arithmetic around the
    calls

- n: 12
  seconds: 65
  ends_at: '10:25'
  talk_track: 'Step one: laspy reads the LAZ file and gives you plain NumPy arrays. The first thing I do is subtract a local
    origin, the minimum corner from the file header. Dutch RD coordinates run to hundreds of thousands of metres, and at
    that size float32 can only step {research.float32_step_m.x|cm} in x and {research.float32_step_m.y|cm} in y; Open3D''s
    PointCloud.from_legacy, for one, converts to float32 by default. After that it''s one copy into Open3D as float64, and
    we''re ready to shrink it.'
  question: Why not keep RD coordinates and stay in float64 everywhere?
  answer: You can, as long as nothing on the way casts to float32, and some tools do that quietly. Subtracting header.mins
    once makes it harmless, and fitted plane coefficients become readable numbers too.
  trace:
  - snippets/s08_load.py
  - 'results/snippets.json: s08_load.py.ok'
  - renders/f1_load.png
  - renders/render_spec.json (local origin = header.mins)
  - data/utrecht_jaarbeurs_200m.laz
  - 'float32 steps: np.spacing(np.float32(v)) at the crop''s RD origin, deterministic; run it to check (results/research_facts.json
    float32_step_m, written by docs/research/research_facts.py)'
  - 'from_legacy defaults to float32 (dtype=Float32 in its signature; a tensor point cloud built from a float64 tensor stays
    float64): research: reports/libraries.md (03_open3d_tensor.py)'
  line_by_line:
