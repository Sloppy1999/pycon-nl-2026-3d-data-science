  talk_track: 'The fix is to never hold the whole file: laspy reads it in chunks of {memory.tile_1km.chunk_size|int} points,
    each chunk keeps one point per {memory.tile_1km.voxel|m} voxel, and one np.unique at the end merges the chunks. On the
    1 km file the load-everything pipeline from slides 12 and 13 peaks at {memory.tile_1km.naive_peak_mb|gb1} on top of
    what the imports already use; this loop peaks at {memory.tile_1km.chunked_peak_mb|gb1}, and its points are exactly those
    of a load-everything first-point-per-voxel reference. It keeps the first point per voxel, not the average from slide
    13, because a first point is a real point and it streams. So why does it work?'
  question: Does that always keep memory small?
  answer: 'No, there are two limits. It only helps if the voxel removes most points: on aerial data like AHN, very fine
    voxels keep almost everything, so output and memory stay large. And it only works for per-point steps; ground removal
    or clustering need neighbours, so those run on tiles with an overlap. More on B2.'
  checks:
