  talk_track: 'Step four: DBSCAN chains together points that sit within {pipeline.params.eps|m} of each other, so ''touches''
    really means ''closer than eps''. On the voxels that aren''t ground and sit more than {pipeline.params.cluster_min_height_m|m}
    above it, I get {pipeline.n_clusters|int} clusters, and {pipeline.noise_share|pct} of those voxels are noise that belong
    to no cluster. A cluster is just a blob, not yet a building or a tree. Naming the blobs is the next step.'
  question: How do you choose eps and min_points?
  answer: 'By looking, plus one rule from testing: eps has to be clearly larger than the voxel size. Too small and most
    points become noise, too large and buildings fuse with their trees; prototype runs showed both. Here it is eps {pipeline.params.eps|m}
    with min_points {pipeline.params.min_points|int} on {pipeline.params.voxel|m} voxels.'
