- n: 2
  seconds: 35
  ends_at: '0:55'
  talk_track: 'For years, serious 3D work meant C++, like the greyed-out code on the left. Both programs on this slide are
    real: I compiled the PCL one and ran both on the same file from today''s case, and the output under each is what they
    printed. Twelve lines of C++ against three of Python for the same job: load the cloud and keep one average point per
    half-metre voxel. The C++ is still there underneath; you just stopped writing it, and if that feels like flying, you''re
    not the first.'
  question: Why do the two counts differ?
  answer: 'Both average the points in each 0.5 m voxel, but the grids sit in different places: PCL anchors its voxels at
    multiples of the leaf size, Open3D at the minimum corner minus half a voxel. Redoing both rules in NumPy on the same
    file gives exactly the two counts on the slide. Neither is wrong; it''s a reminder that ''voxel downsampling'' is a
    family of algorithms.'
