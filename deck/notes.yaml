  talk_track: 'Quiz time. Both blocks compute the same thing: the distance of all {bench.plane.n|int} points to the ground
    plane, and they give exactly the same numbers. A loops over the rows in Python; B is one NumPy expression on whole columns.
    Hands up if you think A is faster. And B? Now the real question: by how much, roughly 2, 10, 100 or 1000 times? Keep
    your answer in mind.'
