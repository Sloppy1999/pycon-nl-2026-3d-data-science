    tile_1km.baseline_mb_after_imports)
  line_by_line:
  - 'v, keys, pts = 0.5, [], []: the voxel size, and two lists that collect each chunk''s voxel keys and points'
  - 'with laspy.open(path) as f: opens the file without reading the points'
  - 'lo, hi = f.header.mins, f.header.maxs: the local origin and the extent, from the header alone'
  - 'dims = ((hi - lo) // v).astype(np.int64) + 1: the number of voxels along x, y and z'
  - 'for c in f.chunk_iterator(1_000_000) (key line): decompresses one million points at a time; only one chunk is in memory'
  - 'xyz = np.c_[c.x, c.y, c.z] - lo: the chunk''s coordinates, local (a chunk has no .xyz, gotcha)'
  - 'ijk = (xyz // v).astype(np.int64).T: each point''s voxel index per axis'
  - 'key = np.ravel_multi_index(ijk, dims): one int64 per voxel, so voxels compare as single numbers (faster than np.unique
    on rows)'
