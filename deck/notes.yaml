- n: 6
  seconds: 40
  ends_at: '3:40'
  talk_track: 'What is this thing, as data? One house, drawn three ways. A scanner gives you the left one, a point cloud: an N by 3 array of x, y and z plus a column per attribute, samples of the surface with nothing joining them. A mesh adds the connections, so area and volume exist. A voxel grid trades exact positions for a regular index of space. Today''s pipeline stays with points and uses voxels only to downsample. Each of the three trades something.'
  question: Should I turn my point cloud into a mesh or voxels first?
  answer: 'Only when the question needs it: area, volume or a solid render want a mesh; occupancy and neighbour lookups like voxels. Every conversion loses detail and adds a parameter you then have to defend, such as the voxel size or the meshing depth. This pipeline stays with points.'
  trace:
  - 'deck/appendix.yaml C1 (bullets, figure, citations; shown here as a main slide)'
  - 'deck/concepts/make_figures.py: deck/assets/concepts/c1_representations.png, results/concepts.json c1'
  - 'research: reports/mental_models.md section 1'

- n: 7
  seconds: 145
  ends_at: '6:05'
  talk_track: 'Whatever the data, a 3D project goes round the same ring, and each stage has its Python tool. The two dark blue
    stages get the data. One, acquisition: a scanner, a camera or a depth sensor gives you raw points, and laspy reads them
    from the LAZ file; this is what single points look like. Two, preparation: you clean the data and register scans into
    one coordinate system, with NumPy and Open3D. NumPy is the glue throughout: every library hands the next one an N by 3
    array. The two lighter blue stages understand it. Three, exploration: Open3D and SciPy give you voxels, planes and
    clusters, here each cluster in its own colour. Four, analysis: you measure and monitor, again in NumPy and SciPy. The two
    green stages deliver it. Five, visualisation: PyVista draws the result, because you need to see it to trust it. Six,
    application: it ends up in a product. And the dashed arrows are the real story: you loop back, from analysis to
    preparation, from a render to a re-scan, whenever the data surprises you. Today''s example is a small version of stages
    one to five. First, four rules of thumb I wish I''d had on day one.'
  question: Where does most of the time go?
  answer: 'Preparation, nearly always. Registration, cleaning and checking coordinates take far longer than any model, which is
    why the rules of thumb on the next slide are about getting the data small and trustworthy first.'
  trace:
  - 'content.yaml slide 7 stages (the former chain slide merged in: laspy, NumPy, Open3D, PyVista with an image each); simplified from Figure 1-12, "A high-level view of the 3D data science workflow", in the book 3D Data Science with Python (O''Reilly)'

- n: 8
  seconds: 45
  ends_at: '6:50'
  talk_track: 'Four rules of thumb for 3D data; they''re the mental model for the rest of the talk, and I''ll bring them
    back at the end with numbers. One: think in arrays, not points: a point cloud is a table, so work on whole columns.
    Two: look before you compute: render it, check units, coordinates and classes, because most 3D bugs are silent. Three:
    make it small first: crop, tile and downsample until it''s fast to try things, then scale up. Four: let compiled code
    do the loops: one call per array or per tile, never one per point. Now, which library does what?'
  question: Aren't these just general data science rules?
  answer: 'Mostly, yes, and that''s the point: 3D data is less exotic than it looks. What changes is the scale and the silence:
    a wrong coordinate system or float32 rounding doesn''t raise an error, it just moves your points by centimetres, and
    a loop over points is a loop over millions.'
  trace:
  - content.yaml slide 8 rules; the same four rules close the talk on slide 30 with their evidence
  where_in_the_talk:
  - '1 Think in arrays: slides 6, 10 and 11 (N by 3 arrays, copy or view at every hand-off)'
  - '2 Look before you compute: slides 5, 20 and 30 (AHN classes, street furniture against the BGT register, the gotchas)'
  - '3 Make it small first: slides 13, 15 and 27 to 29 (voxels, tiles, streaming chunks)'
  - '4 Let compiled code loop: slides 21 to 25 (the quiz, the toll, the profiler, free threads)'
  mental_model: 'The rules rest on the hidden mental-models section (C2 to C9, with citations; C1 and C5 are slides 6 and 20; slide 7 is the workflow); C8 ranks the ideas and says where each joins the talk.'

- n: 9
  seconds: 55
  ends_at: '7:45'
  talk_track: 'Here''s the landscape, mapped onto the six steps we''re about to run, with NumPy carrying the arrays from
    step to step. laspy reads and writes LAS and LAZ, in chunks if you ask; Open3D does the heavy work: voxel downsampling,
    plane fitting and DBSCAN. SciPy''s KDTree answers neighbour questions for all points in one call, and PyVista renders
    every image in this talk. trimesh and PyTorch3D sit apart: useful, just not in this pipeline. So how do these
    libraries hand data to each other?'
  question: Why is PyTorch3D on the map if you don't use it?
  answer: 'Because people ask about it, and it does have a job: differentiable 3D operations on GPU tensors for training.
    It just isn''t a fit for a CPU pipeline on Python 3.13; the install status is on backup slide B3.'
