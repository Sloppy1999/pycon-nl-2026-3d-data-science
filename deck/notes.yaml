- n: 3
  seconds: 30
  ends_at: '1:25'
  talk_track: "Let's see who's really behind the mask. Python is the interface. Take NumPy: when you add two arrays, a
    compiled C core does the loop, with some C++ in parts. Open3D is C++, PyVista draws with VTK, also C++, and laspy
    decodes with Rust. So the C++ never went away; you just call it from Python, and the next slides use exactly that."
  question: Is Python really just a wrapper?
  answer: 'For the heavy 3D libraries, yes: Open3D and VTK (under PyVista) are C++, NumPy''s core is C with some C++, and
    the lazrs decoder behind laspy is Rust; Python calls compiled code. That is also why the hand-off between libraries
    on slide 10 costs something.'
  trace:
  - 'deck/assets/meme/python_cpp_unmasking.png: the Scooby-Doo unmasking template with the Python and C++ logos added'
  - 'Logos: Wikimedia Commons, Python-logo-notext.svg and ISO_C++_Logo.svg'
  checks:
