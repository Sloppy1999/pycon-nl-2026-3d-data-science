    furniture AHN has none: they are all inside class 1. Buildings, which AHN does label, score {pipeline.buildings.precision|pct}
    precision and {pipeline.buildings.recall|pct} recall against class 6. I did try Florent Poux''s PCA plus Random Forest
    idea on these clusters (backup B5): against AHN''s building class it scores {eigen.forest_eigen_only.points_balanced_accuracy|pct}
    balanced accuracy, my rules {eigen.rules.points_balanced_accuracy|pct}. But AHN files facades under class 1 and my rules
