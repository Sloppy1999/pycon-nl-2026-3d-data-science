  talk_track: 'Step five names the blobs with a few rules per cluster: how tall it is, how big its footprint is, and what
    share of its points had more than one return. That last one is the clue for trees: AHN''s spec asks for a leaf-off flight,
    and this one was flown in early April, so pulses slip between bare branches and a tree echoes several times, while roads
    and roofs mostly echo once. Street furniture is the honest weak spot: from the air a lamp post is a few dozen points
    at most, and DBSCAN drops objects of fewer than {pipeline.params.min_points|int} voxels as noise, so my rules find {pipeline.n_objects.street_furniture|int}
    objects, {pipeline.label_points.street_furniture|int} points in all. Cars fail the street furniture rule because they
    are not twice as tall as they are wide, so they stay unlabelled. Then one last step paints these labels back onto every
    original point.'
