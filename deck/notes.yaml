- n: 20
  seconds: 40
  ends_at: '17:45'
  talk_track: 'Why so few points on a pole? Because a scanner doesn''t see the city, it samples it. This map counts points per square metre in our crop, median {concept.c5.median_per_m2|int}. Walls and tree crowns stack points into bright lines and spots, and some bands are thin, so a thin pole can fall between the samples. A radius tuned in one corner can fail in the next: measure density and error before you tune anything. Now, one simple question about every point.'
  question: Is the density on the map the density of the surface?
  answer: 'Not quite: a map cell counts every point above it, so walls and tree crowns look denser than they are as surfaces; a per-surface density needs normals. And the published accuracy is a specification for the whole data set, not a guarantee for each point.'
  trace:
  - 'deck/appendix.yaml C5 (bullets, figure, citations; shown here as a main slide)'
