  talk_track: 'Step two: lay a grid of {pipeline.params.voxel|m} voxels over the crop and replace all the points inside
    each voxel with their average. That leaves {pipeline.kept_share|pct1} as many points, and every step after this gets
    cheaper. One catch: the average is a new point, not one of yours, and LAS attributes such as returns and class are dropped
    unless you carry them along. I store the multiple-return flag as a colour, so each voxel keeps its share of multiple
    returns for step five. Next, the ground.'
  question: Why average? Why not keep one real point per voxel?
  answer: 'You can, and on slide 27 I do exactly that, because it streams. Open3D''s voxel_down_sample returns the centroid:
    I checked that it equals the per-voxel mean, on a grid anchored half a voxel below the minimum corner.'
