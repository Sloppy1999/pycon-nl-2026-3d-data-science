    notes: >-
      Short answer: look at the date before you install. python-pcl and pylas are archived, pclpy has not moved for
      years, and several deep learning libraries for sparse point clouds have had no release for a long time. This is
      from release dates and the archived flag, not from trying them. Two install traps I found while checking:
      the newest PyTorch3D is not on PyPI, and the kaolin name on PyPI is a placeholder. If your pipeline needs one
