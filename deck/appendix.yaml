  - n: C9
    title: "Glossary of 3D data terms"
    table:
      col_widths: [2.2, 7.5]
      columns: ["Term", "Meaning in this talk"]
      rows:
        - cells: ["Point cloud", "An unordered set of 3D points, stored as an N×3 array plus attribute columns"]
          source: "research: reports/mental_models.md section 1"
          status: verified
        - cells: ["Mesh", "Vertices plus faces (usually triangles) that define a surface"]
          source: "research: reports/mental_models.md section 1"
          status: verified
        - cells: ["Voxel", "A cell of a regular 3D grid; voxel downsampling keeps one point per cell"]
          source: "research: reports/mental_models.md section 1; slide 13"
          status: verified
        - cells: ["CRS", "Coordinate reference system: what the numbers mean on Earth (here RD New + NAP)"]
          source: "research: reports/mental_models.md section 3"
          status: verified
        - cells: ["Rigid transform", "Rotation plus translation, written as one four by four matrix"]
          source: "research: reports/mental_models.md section 4"
          status: verified
        - cells: ["Neighbourhood", "The points within a radius or the k nearest; found with a KD-tree or grid"]
          source: "research: reports/mental_models.md section 5"
          status: verified
        - cells: ["Normal", "Direction perpendicular to the local surface, estimated from a neighbourhood"]
          source: "research: reports/mental_models.md section 5"
          status: verified
        - cells: ["Density", "Points per square metre; varies with overlap, occlusion and surface"]
          source: "research: reports/mental_models.md section 6"
          status: verified
        - cells: ["LAS, LAZ, COPC", "LiDAR file format; its compressed form; LAZ organised as an octree for box reads"]
          source: "research: reports/mental_models.md section 2"
          status: verified
        - cells: ["Return", "One echo of a laser pulse; a pulse through a tree can give several"]
          source: "slide 16; research: reports/mental_models.md section 6"
          status: verified
    notes: >-
      Reference slide for Q&A and for the handout. Every term is used with exactly this meaning in the talk; tile means
      the processing squares only, and AHN file means a download.
    sources:
      - "COPC 1.0 specification (copc.io, 2021, no exact date): a LAZ 1.4 file organised as a clustered octree"
      - "ASPRS LAS 1.4 R16 (2025-08-27); LAS 1.5 R00 approved Aug 2025 (lasformat.org)"
