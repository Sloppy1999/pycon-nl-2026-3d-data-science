    small_print: "Sources from F. Poux's beginner video on 3D tools (YouTube, 2025), except 3DBAG. Links checked 2026-10-11."
    notes: >-
      Short answer: start with AHN if your area is in the Netherlands; data/fetch_ahn5.py downloads one AHN file
      and cuts the crop, so change its tile name, expected size and crop box
      constants. Outside the Netherlands, OpenTopography and national portals
      such as France's LiDAR HD have the same kind of airborne LiDAR. Florent Poux's beginner video lists these and
