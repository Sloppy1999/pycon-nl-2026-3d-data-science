# On-screen content of the deck: the single source of truth for every visible word.
# Approved storyboard: ../storyboard.md (2026-10-02). Decisions: 4th class stays "street furniture";
# final benchmarks run on the speaker's desktop; personal talk in the PyCon NL 2026 style (docs/DESIGN.md).
#
# Tokens: {file.key.subkey|fmt} are filled from ../results/*.json by build_deck.py.
#   file = pipeline | bench | memory | snippets | research | facts | profile | ft | eigen | eco
#          (pipeline.json, bench_cliff.json, memory.json, snippets.json, research_facts.json, python_facts.json,
#           profile_loop.json, bench_freethreaded.json)
# build: which builder method draws the slide (deck/build_deck.py slide_<build>), so slide numbers can change freely.
#   fmt  = int   -> 1 239 310 (no-break spaces)             pct  -> 94 %      pct1 -> 93.7 %
#          f1/f2 -> 1 or 2 decimals   x -> 79×  (integer, rounded)   ms -> 15 µs / 5.7 ms / 450 ms / 14.9 s
#          ns -> 450 ns   ns1 -> 3.5 ns   us1 -> 3.0 µs   gb -> 27.8 GB (value already in GiB)   gb1 -> MiB value shown as 3.3 GB
#          mb -> 985 MB   m -> 0.5 m   cm -> 1.6 cm (value in m)   s1 -> 2.8 s (value in s)   nb -> string on one line.
#          Memory: 1 GB = 2^30 bytes (stated in small print).
# A token whose value is missing renders as a visible [placeholder] and is listed by qa/checks.py.
# [Square brackets] in literal text are deliberate placeholders for the speaker (open items).
#
# Global
meta:
  title: "3D Data Science with Python"
  # Personal talk: PyCon NL 2026 style (no company master, branding, logo or confidentiality field).
  theme: pycon_nl_2026          # palette and fonts: docs/DESIGN.md (taken from pycon-nl.org, 2026-10-03)
  palette:                      # every slide colour comes from here (render label colours are the brief's exception)
    navy: "#1C325B"             # pycon-nl.org "north"
    blue: "#2B6797"             # pycon-nl.org "north2"
    sage: "#B1CAC5"             # pycon-nl.org "north3"
    white: "#FFFFFF"
    grey: "#9CA3AF"             # pycon-nl.org UI grey (lines, muted chart bars; not for small text on white)
    slate: "#455A64"            # pycon-nl.org neutral (small print, comments: 7:1 on white)
    ink: "#263238"              # pycon-nl.org neutral (body text)
    light: "#E0E0E0"            # pycon-nl.org neutral (tiles, rules)
  fonts: {sans: "Fira Sans", mono: "Fira Mono"}   # pycon-nl.org uses Fira Sans (Google Fonts, OFL); Fira Mono from the same family for code
  footer: "3D Data Science with Python | PyCon NL 2026"   # on every content slide, with the slide number
  language: en-GB
  author: "Sergio Peral"
  file_name: "20261015_PyCon-NL_3D-Data-Science.pptx"
  source_ahn: "Point cloud: AHN5, Actueel Hoogtebestand Nederland (ahn.nl), Het Waterschapshuis, CC BY 4.0. AHN file 135000_455000, cropped and processed."
  source_renders: "Renders: PyVista, one fixed camera."
  # CC BY 4.0 section 3(a)(1)(C): every "CC BY 4.0" run in slide text links here (deck/build_deck.py, checked by
  # deck/qa/checks.py); slide 29 also prints the readable URI, for the PDF and for photos of the slide.
  licence_url: "https://creativecommons.org/licenses/by/4.0/"
  licence_line: "Licence: creativecommons.org/licenses/by/4.0"
  terms: [point cloud, voxel downsampling, ground removal, clustering, labelling, visualisation, street furniture]
  render_palette:            # inside renders only (brief exception); grayscale levels all differ (luma 48/90/150/194/255)
    background: "#1C325B"    # PyCon NL navy
    ground: "#4A5F69"        # PyCon NL slate #455A64 lifted 5 levels per channel: 42 grey levels from the navy (render.py threshold 40; slate gave 37)
    buildings: "#6FA0CC"     # light tint of PyCon NL blue
    vegetation: "#B1CAC5"    # PyCon NL sage
    street_furniture: "#FFFFFF"
    unlabelled: "#34486B"
    height_ramp: ["#2B6797", "#B1CAC5", "#FFFFFF"]
    clusters: ["#2B6797", "#B1CAC5", "#9CA3AF", "#E0E0E0"]
    noise: "#2A3F66"
  class_names: {ground: "Ground", buildings: "Buildings", vegetation: "Vegetation", street_furniture: "Street furniture"}

slides:
  - n: 1
    build: title
    section: Hook
    layout: 1            # Title (navy)
    transition: fade
    title: "3D Data Science with Python"
    # the cup of the abstract is dropped: Fira Mono has no glyph for it (a fallback emoji font drew it differently on
    # every machine); the spoken "before your coffee went cold" carries the joke. "..." makes the loop valid Python
    # (a body of only a comment is an IndentationError); the speaker may restore the abstract's exact wording
    presenter: "Sergio Peral · ML Engineer, Teqyard"   # affiliation as plain text only (personal talk, no company branding)
    logo: {file: assets/pycon_nl_2026_logo.png, alt: "PyCon NL 2026 logo: the Python snakes filled with a Dutch canal house, tulips and a windmill"}   # supplied by the speaker, 2026-10-04
    seconds: 20

  - n: 2
    build: two_code
    section: Hook
    layout: 5            # Two columns
    transition: fade
    title: "3D used to mean C++. Not anymore"
    # Both sides were compiled or run on the crop (snippets/run_all.py; results/snippets.json): the same crop.pcd,
    # the same 0.5 m voxels. `output` is the line each program printed, read from results/snippets.json
    # (output_line), shown under the code as a terminal line.
    left:  {kind: code, snippet: s02_pcl.cpp, lang: cpp, muted: true, caption: "C++ with PCL",
            output: "{snippets.s02_pcl.cpp.output_line|nb}"}
    right: {kind: code, snippet: s02_python.py, lang: python, caption: "Python with Open3D",
            output: "{snippets.s02_python.py.output_line|nb}"}
    alt: "Two code blocks. Left, greyed out: loading a point cloud and voxel downsampling it with PCL in C++. Right: the same two operations in two lines of Python with Open3D."
    seconds: 35

  - n: 3
    build: logo_wall
    section: Hook
    layout: 4
    transition: fade
    title: "The Python 3D ecosystem at a glance"
    # One row per layer of a point cloud project (the yt talk's layers: files, arrays, algorithms, views), and a row of
    # models. 2026-10-12 relevance pass (speaker: every library on the wall must be relevant to the talk): kept are
    # the libraries the pipeline uses (used: true, blue outline) and those the talk or its backups name: PDAL and
    # pyproj (AHN files and RD New coordinates, slide 4), Numba (B1), Dask (scaling past RAM, slides 24 and 25),
    # trimesh and PyTorch3D (slide 7), scikit-learn (B5), PyTorch (B3), VTK (under PyVista). Dropped: Potree,
    # CloudCompare and QGIS (not Python), GDAL (rasters), OpenCV, COLMAP and nerfstudio (images and photogrammetry),
    # Matplotlib (not used), PyG and Pointcept (deep learning on graphs and point clouds, not covered). The rest is in
    # docs/ECOSYSTEM.md. Every id resolves in deck/ecosystem/ecosystem.yaml (checked against PyPI and GitHub on
    # 2026-10-11); logos are shown unaltered; terms per file: deck/assets/logos/SOURCES.md.
    wall:
      rows:
        - {label: "Load and store", ids: [{id: laspy, used: true}, {id: pdal, caption: true, name: PDAL}, {id: pyproj, caption: true}]}
        - {label: "Arrays and speed", ids: [{id: numpy, used: true}, {id: scipy, caption: true, used: true}, {id: numba, caption: true}, dask]}
        - {label: "Process", ids: [{id: open3d, used: true}, trimesh]}
        - {label: "Visualise", ids: [{id: pyvista, used: true}, vtk]}
        - {label: "Learn", ids: [{id: scikit-learn, caption: true}, pytorch, pytorch3d]}
    small_print: "Blue outline: used in today's pipeline. Logos belong to their owners; no endorsement implied. {eco.n_entries|int} libraries checked on PyPI and GitHub: docs/ECOSYSTEM.md in the repo."
    alt: "Ecosystem wall in five rows of logos; the five used in this talk's pipeline have a blue outline. Load and store: laspy (used), PDAL, pyproj. Arrays and speed: NumPy (used), SciPy (used), Numba, Dask. Process: Open3D (used), trimesh. Visualise: PyVista (used), VTK. Learn: scikit-learn, PyTorch, PyTorch3D."
    seconds: 30

  - n: 4
    build: split_renders
    section: Hook
    layout: 4            # Title and content, body replaced by two render frames
    transition: fade
    title: "Today's case: the Jaarbeurs hall, from a plane"
    # 2026-10-12: the slide proposes the running example of the whole talk and states the data set's specification
    # (speaker's request): a spec table right of the two frames (build_deck.py slide_split_renders `specs`). Values:
    # data/README.md and the crop's LAS header; density = 722 961 points / 40 000 m2 = 18.1 per m2; flown: GPS time
    # of the crop, 5 April 2023 about 23:51 UTC (data/README.md); file size: data/README.md (4 336 320 B).
    specs:
      heading: "The data set"
      rows:
        - ["Area", "200 m × 200 m"]
        - ["Points", "{pipeline.crop.points|int}"]
        - ["Density", "about 18 per m²"]
        - ["Source", "AHN5, ahn.nl"]
        - ["Flown", "April 2023, night"]
        - ["File", "LAZ, 4.3 MB"]
        - ["Coordinates", "RD New + NAP"]
        - ["Licence", "CC BY 4.0"]
      alt: "Specification of the data set: area 200 m by 200 m; {pipeline.crop.points|int} points, about 18 per square metre; source AHN5 from ahn.nl; flown in April 2023, at night; a 4.3 MB LAZ file; coordinates in RD New with NAP heights; licence CC BY 4.0."
    # Two portrait frames side by side (same camera, same scale as slides 11 to 17): f1 raw | f6 labelled.
    # hook_split.png (one wide split frame) is kept as an alternative but made the hall too small.
    visual:
      kind: side_by_side
      files: [f1_load.png, f6_final.png]
      frame: l7
      arrow: "→"
      alts:
        - "Bird's-eye render of the Jaarbeurs hall in Utrecht and the streets, trees and buildings around it, coloured by height from blue near the ground through sage to white on the roofs."
        - "The same view with our labels: ground slate grey, buildings light blue, vegetation sage green, street furniture white."
    # no label chips since 2026-10-12: with the data set table beside them the frames are about 2.5 in wide, too
    # small for four 20 pt chips; the classes are named in the support line and labelled from slide 15 on
    # The arrow points at the roof of the Jaarbeurs hall (BAG pand 0344100000077882, Jaarbeursplein 6), which lies
    # inside the crop: pixel from renders/labels.json f1_load.jaarbeurs_hall (pipeline/render.py jaarbeurs_hall)
    edge_arrow: {text: "Jaarbeurs hall", anchor: "f1_load.jaarbeurs_hall",
                 descr: "Arrow pointing down at the roof of the Jaarbeurs hall"}   # arrow on the LEFT frame
    # no split captions: the brief's ~20 words of body text (QA final round); the label chips and the arrows carry it
    support: "Goal: ground, buildings, vegetation, street furniture; scored against AHN."   # only classes 2 and 6 have an answer key
    source: ahn
    # alt text: one per frame in visual.alts (no slide-level alt)
    seconds: 95

  - n: 5
    build: render_column
    section: Hook
    layout: 7            # Text left, media right (as 8 to 14: the title stays on the 0.600 margin from 3 to 5)
    transition: fade
    title: "A point cloud is just\nan N×3 array"
    visual: {kind: render, file: closeup.png, frame: l7}
    text: {kind: code, snippet: s04_repl.py, lang: pycon}
    support: "Plus one column per attribute:\nintensity, returns, class."
    source: ahn
    alt: "Close-up of the same point cloud, aimed at trees beside the hall, with individual points visible as small squares, next to a Python session showing that the point cloud is an array of {pipeline.points_in|int} rows and 3 columns."
    seconds: 80

  - n: 6
    build: rules
    section: Hook
    layout: 4
    transition: fade
    title: "Four rules of thumb for 3D data"
    # 2026-10-12, speaker: tips at the start and the end to build a mental model; keep it simple. Four rules, one
    # line each; the closing slide (build: rules, evidence: true) brings the same four back with the talk's numbers.
    rules:
      - {head: "Think in arrays, not points", text: "A point cloud is an N×3 table plus attribute columns."}
      - {head: "Look before you compute", text: "Render it; check units, coordinates and classes."}
      - {head: "Make it small first", text: "Crop, tile and downsample; scale up last."}
      - {head: "Let compiled code loop", text: "One call per array or tile, never per point."}
    alt: "Four tiles, one rule of thumb each. 1 Think in arrays, not points: a point cloud is an N by 3 table plus attribute columns. 2 Look before you compute: render it; check units, coordinates and classes. 3 Make it small first: crop, tile and downsample; scale up last. 4 Let compiled code loop: one call per array or tile, never per point."
    seconds: 45

  - n: 7
    build: ecosystem
    section: Landscape
    layout: 4
    transition: fade
    title: "No single library does the whole job"
    visual:
      kind: ecosystem_map
      steps: ["Load", "Voxel downsampling", "Ground removal", "Clustering", "Labelling", "Visualisation"]
      libraries:
        - {name: "laspy", job: "LAS/LAZ in and out", steps: [1]}
        - {name: "Open3D", job: "downsampling, planes, DBSCAN", steps: [2, 3, 4]}
        - {name: "SciPy KDTree", job: "batch neighbour queries", steps: [4, 5, 6]}   # 4: height_above (slide 14 code)
        - {name: "PyVista", job: "off-screen renders", steps: [6]}
        - {name: "NumPy", job: "the arrays every step passes on", steps: [1, 2, 3, 4, 5, 6]}
        - {name: "trimesh", job: "meshes, hulls, oriented boxes", steps: [], note: "Not in this pipeline"}
        - {name: "PyTorch3D", job: "differentiable 3D for training", steps: [], note: "Not in this pipeline"}
    alt: "Diagram: six pipeline steps in a row. Under each step, the library that does it: laspy under Load, Open3D across voxel downsampling, ground removal and clustering, SciPy KDTree under clustering, labelling and visualisation, PyVista under visualisation, NumPy under all six steps, the arrays every step passes on. PyTorch3D and trimesh sit apart, dashed, marked not in this pipeline."
    seconds: 55

  - n: 8
    build: chain_images
    section: Landscape
    layout: 4
    transition: fade
    title: "laspy loads, Open3D computes, PyVista draws"
    # 2026-10-12, speaker: images under the boxes instead of the "worth it / not for this pipeline" lists (those
    # moved to the notes). One tile per library, as wide as its box: what that library hands on in this pipeline.
    # laspy: the close-up of slide 5 (single points as read from the file); NumPy: the first three rows of
    # xyz = las.xyz - las.header.mins on the crop (printed with np.set_printoptions(precision=1), float64,
    # shape (722961, 3), checked 2026-10-12); Open3D: the clusters of slide 14; PyVista: the final render.
    chain: ["laspy", "NumPy", "Open3D", "PyVista"]
    images:
      - {file: closeup.png, caption: "reads the LAZ file", alt: "Close-up render of the crop: single points as laspy reads them."}
      - {array: ["    x     y    z", "199.6 199.9 26.3", "199.2 199.9 26.4", "199.4 199.7 26.4", "  ...   ...  ..."],
         shape: ["(722961, 3)", "float64"], caption: "holds the N×3 array",
         alt: "The first three rows of the crop's xyz array in local metres, shape 722961 by 3, float64."}
      - {file: f4_clusters.png, caption: "voxels and clusters", alt: "The clusters render of slide 14: ground grey, each cluster in one of four colours."}
      - {file: f6_final.png, caption: "draws the result", alt: "The final render: ground, buildings, vegetation and street furniture."}
    source: ahn
    alt: "A chain of four boxes, laspy to NumPy to Open3D to PyVista, each with an image of what it hands on: laspy a close-up of single points read from the file; NumPy the first rows of the N by 3 coordinate array; Open3D the clustered point cloud; PyVista the final labelled render."
    seconds: 80

  - n: 9
    build: handoffs
    section: Landscape
    layout: 4
    transition: fade
    title: "Python passes the array, not the points"
    # Four hand-offs of the pipeline, in order (laspy -> NumPy -> Open3D -> NumPy -> PyVista). Every verdict is a
    # check in bench/python_facts.py (results/python_facts.json); `verify` names the boolean that must hold for the
    # verdict shown (the build warns otherwise). snippets/s06b_handoffs.py runs the same four calls with asserts.
    # 2026-10-12, speaker: explain the difference and why it matters: a two-panel legend above the rows (copy: two
    # blocks of memory; view: two names on one block) and the consequence as the support line.
    legend:
      copy: {head: "copy", text: "new memory: costs time and RAM"}
      view: {head: "view", text: "same memory: free, writes show through"}
    rows:
      - {code: "las.xyz", kind: copy, verify: facts.las_xyz.fresh_copy_each_access, text: "new array, every access"}
      - {code: "Vector3dVector(xyz)", kind: copy, verify: facts.vector3dvector.copies, text: "float32: {facts.factor_v3d_float32_vs_float64_f.median|x} slower"}
      - {code: "np.asarray(pcd.points)", kind: view, verify: facts.asarray_points.view, text: "writes reach the point cloud"}
      - {code: "pv.PolyData(pts)", kind: view, verify: facts.polydata.shares_memory_open3d_view, text: "same memory as pts"}
    pills: {copy: "copy", view: "view"}
    # 24 B per point measured for the float64 xyz on the 1 km AHN file (results/memory.json); × 21 013 926 points
    # = 0.47 GB (1 GB = 2^30 B)
    support: "Each xyz copy costs {memory.tile_1km.bytes_per_point.xyz_float64|int} B per point: 0.5 GB per 1 km AHN file."
    conditions: facts
    conditions_short: true
    conditions_note: "Copy or view: checked by writing to one side and reading the other, and with np.shares_memory. float32: Vector3dVector of a float32 copy, {facts.timings.v3d_float32.median_ms|ms}, against the float64 xyz of slide 11, {facts.timings.v3d_float64_f.median_ms|ms}."
    alt: "Above, a legend: a copy is new memory and costs time and RAM; a view is the same memory, free, and writes show through. Below, four rows, one per hand-off between the libraries. las.xyz: copy, a new array on every access. Vector3dVector of xyz: copy, and {facts.factor_v3d_float32_vs_float64_f.median|x} slower for float32 input. np.asarray of pcd.points: view, writes reach the point cloud. pv.PolyData of pts: view, the same memory as pts."
    seconds: 70

  - n: 10
    build: filmstrip
    section: Pipeline
    layout: 4
    transition: fade
    title: "Six steps turn a point cloud into labels"
    visual:
      kind: filmstrip
      frames: [f1_load.png, f2_voxel.png, f3_ground.png, f4_clusters.png, f5_labels.png, f6_final.png]
      names: ["Load", "Voxel downsampling", "Ground removal", "Clustering", "Labelling", "Visualisation"]
      tags: ["laspy", "Open3D", "Open3D", "Open3D, SciPy", "NumPy, SciPy", "SciPy, PyVista"]
      morph_first_as: "!!render"
    source: ahn          # the thumbnails are AHN renders (CONTRACTS.md, data/DATA_LICENSE.md)
    alt: "Six thumbnails of the same area from the same camera, one per pipeline step: load, voxel downsampling, ground removal, clustering, labelling, visualisation."
    seconds: 25

  # Slides 11 to 17: identical L7 geometry; objects named !!title !!code !!hl !!support !!src !!render !!lab_*

  - n: 11
    build: morph
    section: Pipeline
    layout: 7
    transition: morph
    title: "1 Load: laspy hands you NumPy"
    code: {snippet: s08_load.py}
    visual: {kind: render, file: f1_load.png, frame: l7}
    support: "Subtract a local origin before anything else."
    source: ahn
    alt: "The crop as a point cloud, coloured by height: the hall roof white, the ground blue."
    # 2026-10-12, speaker: a simple visualisation per step: a small navy sketch in the render's top-right corner
    # (deck/lib/sketches.py; the label chips keep clear of it). Load: the first point's x in RD and after
    # subtracting header.mins, with float32's step at each size (np.spacing(np.float32(v)): 0.015625 m at
    # 135 914.6, 1.53e-5 m at 199.6; the RD step is the research token used in the notes)
    sketch: {kind: origin, rd: "135914.6", local: "199.6", op: "− header.mins", rd_step: "{research.float32_step_m.x|cm}", local_step: "15 µm",
             step_label: "float32 step", alt: "Sketch: the first point's x, 135914.6 m in RD, becomes 199.6 m after subtracting header.mins; float32 then steps 15 micrometres instead of {research.float32_step_m.x|cm}."}
    seconds: 65

  - n: 12
    build: morph
    section: Pipeline
    layout: 7
    transition: morph
    title: "2 Voxel downsampling: one average per voxel"
    code: {snippet: s09_voxel.py}
    visual: {kind: render, file: f2_voxel.png, frame: l7}
    support: "{pipeline.points_in|int} points in,\n{pipeline.points_after_voxel|int} out at {pipeline.params.voxel|m} voxels."
    source: ahn
    alt: "Same view after voxel downsampling: fewer points, same size, same area."   # was "fewer, larger points": 3 px since the render fix (renders/render_spec.json)
    sketch: {kind: voxel, caption: "{pipeline.params.voxel|m} voxels",
             alt: "Sketch: a grid of cells with several small points in each; every occupied cell keeps one larger point at the average of its points."}
    seconds: 55

  - n: 13
    build: morph
    section: Pipeline
    layout: 7
    transition: morph
    title: "3 Ground removal: one plane per tile"
    code: {snippet: s10_ground.py}
    visual: {kind: render, file: f3_ground.png, frame: l7}
    labels_from: f6_final            # the Ground chip only, same rectangle as on 14 to 16 (greyscale: ground is
    labels_only: [ground]            # not told apart by colour alone)
    support: "Scored against AHN's ground:\n{pipeline.ground.precision|pct} precision, {pipeline.ground.recall|pct} recall."
    source: ahn
    # joke (notes slide 13): the Zen of Python line "Flat is better than nested." (checked by snippets/s10b_zen.py)
    # is spoken now; its on-slide REPL callout was dropped on 2026-10-12, because the step sketch takes the top of
    # the render and the callout did not fit beside it
    alt: "Same view: ground points in slate grey, labelled Ground, everything else still coloured by height."
    sketch: {kind: ground, caption: "one plane per tile",
             alt: "Sketch, side view: ground points along a gently sloping street, a building and a tree above them; each of two tiles fits its own straight plane through its ground points."}
    seconds: 75

  - n: 14
    build: morph
    section: Pipeline
    layout: 7
    transition: morph
    title: "4 Clustering: DBSCAN groups what touches"
    code: {snippet: s11_cluster.py}
    visual: {kind: render, file: f4_clusters.png, frame: l7}
    labels_from: f6_final
    labels_only: [ground]
    support: "{pipeline.n_clusters|int} clusters. Clusters are not labels yet."
    source: ahn
    alt: "Same view: ground stays slate grey, labelled Ground; the other points are grouped into clusters, each drawn in one of four cycling colours (blue, sage, grey, light grey), with noise dimmed."
    sketch: {kind: dbscan, caption: "eps = {pipeline.params.eps|m}",
             alt: "Sketch: two groups of points, each a cluster because every point has neighbours within eps, shown as a dashed circle; a lone point far away is noise."}
    seconds: 55

  - n: 15
    build: morph
    section: Pipeline
    layout: 7
    transition: morph
    title: "5 Labelling: rules name the clusters"
    code: {snippet: s12_label.py}
    visual: {kind: render, file: f5_labels.png, frame: l7}
    labels_from: f6_final            # same anchors as 15 and 16, so the chips stay still through the Morph
    support: "Leaf-off scan: bare trees echo several times."   # one line; the pulses and branches are in the notes
    small_print: "Street furniture: {pipeline.n_objects.street_furniture|int} objects, {pipeline.label_points.street_furniture|int} points, drawn enlarged. Poles nearly vanish."
    source: ahn
    alt: "Same view with four classes, each labelled directly: ground slate grey, buildings light blue, vegetation sage green, street furniture white."
    sketch: {kind: rules, caption: "shape → class",
             alt: "Sketch: three cluster shapes, a tree crown with many echoes, a wide flat building and a thin pole, each with an arrow to its class colour: vegetation, buildings, street furniture."}
    seconds: 70

  - n: 16
    build: morph
    section: Pipeline
    layout: 7
    transition: morph
    title: "6 Visualisation: PyVista paints every point"
    code: {snippet: s13_render.py}
    visual: {kind: render, file: f6_final.png, frame: l7}
    labels_from: f6_final
    support: "Fixed camera, off-screen, one PNG per step."
    small_print: "Street furniture: {pipeline.n_objects.street_furniture|int} objects, {pipeline.label_points.street_furniture|int} points, drawn enlarged. Poles nearly vanish."
