        - {label: "Arrays and speed", ids: [{id: numpy, used: true}, {id: scipy, caption: true, used: true}, {id: numba, caption: true}, dask]}
        - {label: "Process", ids: [{id: open3d, used: true}, trimesh]}
        - {label: "Visualise", ids: [{id: pyvista, used: true}, vtk]}
        - {label: "Learn", ids: [{id: scikit-learn, caption: true}, pytorch3d]}
    alt: "Ecosystem wall in five rows of logos; the five used in this talk's pipeline have a blue outline. Load and store: laspy (used), PDAL, pyproj. Arrays and speed: NumPy (used), SciPy (used), Numba, Dask. Process: Open3D (used), trimesh. Visualise: PyVista (used), VTK. Learn: scikit-learn, PyTorch3D."
