  - n: 21
    build: quiz
    section: Performance
    layout: 5
    transition: fade
    title: "Quiz: which is faster, and by how much?"
    # 2026-10-12, speaker: make it a quiz (and the old slide 18, "How far is each point from the ground?", is
    # removed, so the task line under the title says what both codes compute). Rows A and B instead of the Drake
    # cross and check (they gave the answer away); four answer pills under the rows; slide 22 reveals the answer
    # on click. Code at 20 pt (>= 18). The snippets were benchmarked verbatim, so they stay as they are.
    task: "Distance of every point to the ground plane, {bench.plane.n|int} points."
    rows:
      - {snippet: s16_loop.py, letter: "A", alt: "Option A: a Python for loop over the rows of P, one distance per point."}
      - {snippet: s16_vec.py, letter: "B", alt: "Option B: one element-wise NumPy expression over the columns of P."}
    code_pt: 20
    answers: ["2×", "10×", "100×", "1000×"]
    answers_label: "The faster one wins by about:"
    small_print: "Both give identical results (np.array_equal). P: the crop's xyz from slide 12, column-ordered. plane: one seeded segment_plane on the whole crop."
    alt: "Quiz. Two code blocks computing the distance of every point to a plane: A, a Python for loop over the rows of a NumPy array; B, one element-wise NumPy expression. Below them four answers for how much faster the faster one is: 2, 10, 100 or 1000 times."
    seconds: 75

  - n: 22
    build: chart_hero
    section: Performance
    layout: 7
    transition: fade
    title: "How much slower is the loop over rows?"
    # question title: the hero number (on-click build) gives the answer, so the title must not reveal it
    # no "two orders of magnitude" title: the factor holds for one loop on one memory layout (a row-ordered copy,
    # plain Python floats and the kNN loop all give smaller factors, bench_cliff.json); the phrase is spoken only
    chart:
      kind: column_log
      unit: ms
      bars:
        - {label: "Loop over NumPy rows", value: "bench.plane.loop_numpy_rows.median_ms", highlight: true}
        - {label: "One NumPy expression", value: "bench.plane.vectorised.median_ms"}
      axis_title: "Median time per run, log scale"
    hero: {value: "{bench.plane.factor.median|x}", label: "slower", build_on_click: true}   # "same answer" is in the support line
    # NumPy-level operations per procedure, counted with dis on the snippets (3.13 bytecode): loop body per row = 3 element
    # reads + 6 arithmetic + abs + row view + store = 12; the expression = 6 arithmetic + abs = 7, once for all rows
    support: "Same data, same answer, far fewer calls into compiled code."
    # the array the factor holds for (appended to the Conditions line)
    conditions_note: "Array: {bench.plane.array.how|nb}, {bench.plane.array.dtype}, column-ordered as laspy returns it; on a row-ordered copy the factor is {bench.plane.sensitivity.factor_c_contiguous.median|x}."
    conditions: bench
    conditions_short: true      # 2026-10-12, speaker: concise conditions; the full line is in the notes
    conditions_threads: true   # the plane runs' thread count and CPU/wall ratio: only here, where they are charted
    alt: "Column chart on a logarithmic time axis. The Python loop over NumPy rows takes {bench.plane.loop_numpy_rows.median_ms|ms}; one NumPy expression takes {bench.plane.vectorised.median_ms|ms}."
    seconds: 80

  - n: 23
    build: toll
    section: Performance
    layout: 4
    transition: fade
    title: "Batch calls into compiled code"
    visual: {kind: toll_diagram, loop_code: "for p in pts: f(p)", call_code: "f(pts)", lane_top: "Python", lane_bottom: "compiled code", times: "× N", toll_label: "", caption_loop: "N trips: {bench.plane.loop_numpy_rows.median_ms|ms}", caption_call: "Array operations: {bench.plane.vectorised.median_ms|ms}", legend_toll: "toll per crossing", legend_work: "work in compiled code", legend_arrow: "call and return"}   # no word label: the blue toll ticks and the title carry "toll" (body ~20 words)
    hero: {value: "{bench.plane.per_step_ns_loop|ns}", label: "per full loop step"}
    takeaway: "Prefer one call on the whole array over N calls on single points."
    # how the per-call cost was measured (appended to the Conditions line; brief: conditions for every benchmark)
    # distance_upper_bound: its value is stored only inside a description string in bench_cliff.json, so it is not printed
    conditions_note: "Loop-step time includes indexing and arithmetic, not just call overhead. The NumPy expression makes several array operations; the diagram shows the batching principle."
    conditions: bench
    conditions_short: true      # 2026-10-12, speaker: concise conditions; the full line is in the notes
    alt: "Diagram: a Python lane above a dashed boundary and a compiled-code lane below. On the left a loop crosses the boundary many times, paying a toll each time, marked by blue ticks on the boundary. On the right one call crosses once and does all the work below the line."
    seconds: 95

  - n: 24
    build: profile
    section: Performance
    layout: 4
    transition: fade
    title: "Profile before you vectorise"
    # 2026-10-12, speaker: use Scalene (github.com/plasma-umass/scalene) for the CPU profile too. The command on top,
    # then the slide-18 lines with one bar each: Python, native and system share of the whole run, as Scalene
    # reports it (bench/profile_loop_scalene.py, results/profile_scalene.json: the loop and the one-expression
    # version, 30 repeats, median of 3 runs). Replaces the cProfile output and the icicle (those result files stay
    # as a cross-check; notes 22). The for and indexing lines show 0 %: Scalene bills a sample to the line the
    # interpreter is on after a long C call returns (notes).
    line_profile:
      command: "$ scalene run --cpu-only loop.py"
      legend: {python: "Python", native: "native, i.e. NumPy", system: "system"}
      rows:
        - {tag: "loop", line: for}
        - {line: unpack}
        - {line: loop_body, key: true}
        - {tag: "NumPy", line: vectorised, gap: true, key: true}
      alt: "Per-line CPU profile from Scalene. For the loop version, the for line and the line that unpacks a row show 0 %, and the line that computes the distance takes {prof.lines.loop_body.total|int} % of the whole run, almost all of it native NumPy time and about {prof.lines.loop_body.python|int} % in the Python interpreter. The one-expression NumPy version takes {prof.lines.vectorised.total|f1} %."
    support: "The loop's last line takes {prof.lines.loop_body.total|int} % of the run. As one NumPy expression: {prof.lines.vectorised.total|f1} %."
    # 2026-10-14: the times are totals over prof.repeats calls (share × elapsed_s); per call (deck/lib/tokens.py
    # Resolver._derive) they land near slide 22's standalone medians. The remaining gap is not attributed: profiler
    # overhead was not isolated.
    note: "Times are totals over {prof.repeats|int} calls of each version: about {prof.per_call_ms.loop_body|ms} and {prof.per_call_ms.vectorised|ms} per call under the profiler, against {bench.plane.loop_numpy_rows.median_ms|ms} and {bench.plane.vectorised.median_ms|ms} timed alone (slide 22). Profile to find the line; benchmark to measure the gain."
    conditions: scalene_cpu
    seconds: 55

  - n: 25
    build: chart_hero
    section: Performance
    layout: 7
    transition: fade
    title: "Will free-threaded Python save my loop?"
    # question title, answered by the hero. Timed on CPython 3.14t (GIL disabled) and the default 3.14 build of the
    # same release (bench/bench_freethreaded.py, results/bench_freethreaded.json); threads_8 is the fastest thread
    # count measured on the free-threaded build (summary.best_threads_ft)
    chart:
      kind: column_log
      unit: ms
      bars:
        # 2026-10-14: four bars, so the GIL claim in the support line is on the chart. Loop and NumPy on the
        # free-threaded build; "With GIL" is the default 3.14.7 build, same loop over 8 threads (both builds measured
        # in the same script, same input, outputs checked equal). Labels of at most 6 characters per line: the L7
        # media box gives each of four categories about 1 in at 20 pt; ×8 = 8 threads (hero and support line say so)
        - {label: "Loop", value: "ft.builds.free_threaded.timings.loop.median_ms"}
        - {label: "GIL\n×8", value: "ft.builds.gil.timings.threads_8.median_ms"}
        - {label: "No GIL\n×8", value: "ft.builds.free_threaded.timings.threads_8.median_ms", highlight: true}
        - {label: "1 call", value: "ft.builds.free_threaded.timings.vectorised.median_ms"}   # "NumPy" wraps at 20 pt; the support line names it
      axis_title: "Median time per run, log scale"
      axis_max_ms: 1000          # the slowest bar is under 1 s: no empty decade above it
    hero: {value: "{ft.summary.ft_speedup_best_vs_loop.median|x}", label: "faster on {ft.summary.best_threads_ft|int} free threads"}
    # calls per procedure as on slide 22 (12 per row in the loop body, 7 for the expression); threads split the rows, not the calls
    support: "×{ft.summary.best_threads_ft|int}: {ft.summary.best_threads_ft|int} threads. With the GIL, no gain. One NumPy call is {ft.summary.ft_vectorised_vs_best_threads.median|x} faster still."
    conditions: ft
    conditions_short: true      # 2026-10-12, speaker: concise conditions; the full line is in the notes
    conditions_note: "Loop: the slide 21 loop. Threads: the same loop body over N slices of P, concurrent.futures.ThreadPoolExecutor. Default build with the GIL: loop {ft.builds.gil.timings.loop.median_ms|ms}, {ft.summary.best_threads_ft|int} threads {ft.builds.gil.timings.threads_8.median_ms|ms}."
    alt: "Column chart on a logarithmic time axis. On the free-threaded build: the loop on one thread takes {ft.builds.free_threaded.timings.loop.median_ms|ms}; the same loop split over {ft.summary.best_threads_ft|int} threads takes {ft.builds.free_threaded.timings.threads_8.median_ms|ms}; one NumPy expression on one thread takes {ft.builds.free_threaded.timings.vectorised.median_ms|ms}. With the GIL, the {ft.summary.best_threads_ft|int} threads take {ft.builds.gil.timings.threads_8.median_ms|ms}."
    seconds: 50

  - n: 26
    build: bar_gb
    section: RAM
    layout: 8
    transition: fade
    title: "Loading this area's AHN file outgrows {memory.ram_reference_gb.1|int} GiB"   # every loaded state on the chart, not the LAS records alone
    chart:
      kind: bar_gb
      bars:
        # "\n": two-line category labels, so the plot gets more of the chart width (RAM bars on one line each)
        - {label: "{memory.ram_reference_gb.1|int} GiB RAM", value: "memory.ram_reference_gb.1", kind: reference}
        - {label: "LAS records\n(computed)", value: "memory.big_file.computed_gb.las_records"}
        - {label: "+ float64 xyz\n(computed)", value: "memory.big_file.computed_gb.plus_xyz"}
        - {label: "Load + voxels\n(extrapolated)", value: "memory.big_file.computed_gb.our_pipeline", highlight: true}
        # 2026-10-14: the last two bars are a measured pair on the 1 km file (21 013 926 points), so the chunked peak is
        # compared with its own load-everything peak, not with the extrapolated big-file bars; MiB × 1/1024 = GiB
        - {label: "Load + voxels,\n1 km (measured)", value: "memory.tile_1km.naive_peak_mb", scale: 0.0009765625}
        - {label: "Chunked,\n1 km (measured)", value: "memory.tile_1km.chunked_peak_mb", scale: 0.0009765625, highlight: true}
      threshold: "memory.ram_reference_gb.1"   # dashed line at the 32 GiB RAM bar's end, across the bars below it
    hero: {value: "{memory.tile_1km.bytes_per_point.pipeline_retained|int} B", label: "retained per input point"}
    support: "{memory.big_file.points|int} points × ≈{memory.tile_1km.bytes_per_point.pipeline_retained|int} B each."
    # note box under the support line: why 86 B and not the 24 B of one xyz array (bytes_per_point, 1 km file)
    note: "Big-file bars are computed, never run: load + voxels, arrays kept, temporaries excluded (with them: {memory.big_file.computed_gb_extra.our_pipeline_peak|gb}). The 1 km bars are measured peaks on one smaller file."
    # joke line (notes slide 26), 20 pt slate under the small print: the RAM of the machine everything ran on
    machine_line: "Stream chunks to fit within RAM."
    conditions: memory
    conditions_short: true      # 2026-10-12, speaker: concise conditions; the full line is in the notes
    alt: "Horizontal bar chart in gibibytes for one {research.ahn5_c_31hz2.width_km|f2t} by {research.ahn5_c_31hz2.height_km|f2t} km AHN5 file with {memory.big_file.points|int} points: a reference bar for {memory.ram_reference_gb.1|int} GiB of RAM, then LAS records at {memory.big_file.computed_gb.las_records|gb}, plus a float64 copy of the coordinates at {memory.big_file.computed_gb.plus_xyz|gb}, and our load and voxel downsampling steps (slides 12 and 13), all arrays kept, at {memory.big_file.computed_gb.our_pipeline|gb}; a dashed line continues the end of the {memory.ram_reference_gb.1|int} GiB bar down across the data bars; the three data bars are computed, not run; then two measured peaks on the smaller 1 km file: loading everything and downsampling, {memory.tile_1km.naive_peak_mb|gb1}, and the chunked approach, {memory.tile_1km.chunked_peak_mb|gb1}."
    seconds: 55

  - n: 27
    build: rules
