    row_h_in: 0.44
    row_gap_in: 0.08
    code_pt: 18
    text_pt: 20
    conditions: facts
    conditions_short: true
    conditions_note: "Copy or view: checked by writing to one side and reading the other, and with np.shares_memory. float32: Vector3dVector of a float32 copy, {facts.timings.v3d_float32.median_ms|ms}, against the float64 xyz of slide 12, {facts.timings.v3d_float64_f.median_ms|ms}."
    alt: "Takeaway: every unnecessary xyz copy costs {memory.tile_1km.bytes_per_point.xyz_float64|int} B per point, 0.5 GB per 1 km AHN file. The problem, copies: two names, each on its own block of memory; new memory costs time and RAM. The solution, views: two names on one block; same memory, free, writes show through. Below, four rows, one per hand-off between the libraries. las.xyz: copy, a new array on every access. Vector3dVector of xyz: copy, Open3D gets its own copy. np.asarray of pcd.points: view, writes reach the point cloud. pv.PolyData of pts: view, the same memory as pts."
