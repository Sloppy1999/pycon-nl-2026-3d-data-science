# On-screen content of the deck: the single source of truth for every visible word.
# Approved storyboard: ../storyboard.md (2026-10-02). Decisions: 4th class stays "street furniture";
# final benchmarks run on the speaker's desktop; personal talk in the PyCon NL 2026 style (docs/DESIGN.md).
#
# Tokens: {file.key.subkey|fmt} are filled from ../results/*.json by build_deck.py.
#   file = pipeline | bench | memory | snippets | research | facts | profile | ft | eigen | eco
#          (pipeline.json, bench_cliff.json, memory.json, snippets.json, research_facts.json, python_facts.json,
#           profile_loop.json, bench_freethreaded.json)
# build: which builder method draws the slide (deck/build_deck.py slide_<build>), so slide numbers can change freely.
#   fmt  = int   -> 1 239 310 (no-break spaces)             pct  -> 94 %      pct1 -> 93.7 %
#          f1/f2 -> 1 or 2 decimals   x -> 79×  (integer, rounded)   ms -> 15 µs / 5.7 ms / 450 ms / 14.9 s
#          ns -> 450 ns   ns1 -> 3.5 ns   us1 -> 3.0 µs   gb -> 27.8 GB (value already in GiB)   gb1 -> MiB value shown as 3.3 GB
#          mb -> 985 MB   m -> 0.5 m   cm -> 1.6 cm (value in m)   s1 -> 2.8 s (value in s)   nb -> string on one line.
#          Memory: 1 GB = 2^30 bytes (stated in small print).
# A token whose value is missing renders as a visible [placeholder] and is listed by qa/checks.py.
# [Square brackets] in literal text are deliberate placeholders for the speaker (open items).
#
# Global
meta:
  title: "3D Data Science with Python"
  # Personal talk: PyCon NL 2026 style (no company master, branding, logo or confidentiality field).
  theme: pycon_nl_2026          # palette and fonts: docs/DESIGN.md (taken from pycon-nl.org, 2026-10-03)
  palette:                      # every slide colour comes from here (render label colours are the brief's exception)
    navy: "#1C325B"             # pycon-nl.org "north"
    blue: "#2B6797"             # pycon-nl.org "north2"
    sage: "#B1CAC5"             # pycon-nl.org "north3"
    white: "#FFFFFF"
    grey: "#9CA3AF"             # pycon-nl.org UI grey (lines, muted chart bars; not for small text on white)
    slate: "#455A64"            # pycon-nl.org neutral (small print, comments: 7:1 on white)
    ink: "#263238"              # pycon-nl.org neutral (body text)
    light: "#E0E0E0"            # pycon-nl.org neutral (tiles, rules)
    warn: "#B3261E"             # red, used only for the part of a bar past the RAM limit (slide 30; 6.5:1 on white)
    blue_tint: "#DFE8EF"        # blue #2B6797 at 15 % on white: note boxes (not a site colour; ink text about 11:1 on it)
  fonts: {sans: "Fira Sans", mono: "Fira Mono"}   # pycon-nl.org uses Fira Sans (Google Fonts, OFL); Fira Mono from the same family for code
  footer: "3D Data Science with Python | PyCon NL 2026"   # on every content slide, with the slide number
  # 2026-10-13 restructure: the chapters in the footer breadcrumb (current one in blue SemiBold), from the first
  # chapter on; `sections` are the slide sections each chapter covers. Replaces the agenda slide.
  chapters:
    # 2026-10-14 (Phase 3): Intro and Wrap-up added, so every footer slide highlights its chapter; Reality after Memory
    - {crumb: "Intro", sections: [Hook]}
    - {crumb: "Data", sections: [Data]}
    - {crumb: "Toolbox", sections: [Toolbox]}
    - {crumb: "Pipeline", sections: [Pipeline]}
    - {crumb: "Memory", sections: [Memory]}
    - {crumb: "Speed", sections: [Speed]}
    - {crumb: "Reality", sections: [Reality]}
    - {crumb: "Wrap-up", sections: [Rules, Close]}
  # `rule: [k]` on a slide puts a small rule badge top right (blue number disc + the rule): the slide is evidence for rule k
  # of slide 4 (numbered in the order the talk first proves them). `step: k` (slides 12 to 18) adds the six-step tracker
  # left of it, step k in blue. `footnote` puts one line in front of the Conditions line.
  language: en-GB
  author: "Sergio Peral"
  file_name: "20261015_PyCon-NL_3D-Data-Science.pptx"
  source_ahn: "Data: AHN5, Het Waterschapshuis, CC BY 4.0."
  source_renders: "Renders: PyVista, one fixed camera."
  # CC BY 4.0 section 3(a)(1)(C): every "CC BY 4.0" run in slide text links here (deck/build_deck.py, checked by
  # deck/qa/checks.py); slide 32 also prints the readable URI, for the PDF and for photos of the slide.
  licence_url: "https://creativecommons.org/licenses/by/4.0/"
  licence_line: "Licence: creativecommons.org/licenses/by/4.0"
  terms: [point cloud, voxel downsampling, ground removal, clustering, labelling, visualisation, street furniture]
  render_palette:            # inside renders only (brief exception); grayscale levels all differ (luma 48/90/150/194/255)
    background: "#1C325B"    # PyCon NL navy
    ground: "#4A5F69"        # PyCon NL slate #455A64 lifted 5 levels per channel: 42 grey levels from the navy (render.py threshold 40; slate gave 37)
    buildings: "#6FA0CC"     # light tint of PyCon NL blue
    vegetation: "#B1CAC5"    # PyCon NL sage
    street_furniture: "#FFFFFF"
    unlabelled: "#34486B"
    height_ramp: ["#2B6797", "#B1CAC5", "#FFFFFF"]
    clusters: ["#2B6797", "#B1CAC5", "#9CA3AF", "#E0E0E0"]
    noise: "#2A3F66"
  class_names: {ground: "Ground", buildings: "Buildings", vegetation: "Vegetation", street_furniture: "Street furniture"}

slides:
  - n: 1
    build: title
    section: Hook
    layout: 1            # Title (navy)
    transition: fade
    title: "3D Data Science with Python"
    # the cup of the abstract is dropped: Fira Mono has no glyph for it (a fallback emoji font drew it differently on
    # every machine); the spoken "before your coffee went cold" carries the joke. "..." makes the loop valid Python
    # (a body of only a comment is an IndentationError); the speaker may restore the abstract's exact wording
    presenter: "Sergio Peral · ML Engineer, Teqyard"   # affiliation as plain text only (personal talk, no company branding)
    logo: {file: assets/pycon_nl_2026_logo.png, alt: "PyCon NL 2026 logo: the Python snakes filled with a Dutch canal house, tulips and a windmill"}   # supplied by the speaker, 2026-10-04
    seconds: 20

  - n: 2
    build: two_code
    section: Hook
    layout: 5            # Two columns
    transition: fade
    title: "3D meant C++; now Python drives it"
    # Both sides were compiled or run on the crop (snippets/run_all.py; results/snippets.json): the same crop.pcd,
    # the same 0.5 m voxels. `output` is the line each program printed, read from results/snippets.json
    # (output_line), shown under the code as a terminal line.
    left:  {kind: code, snippet: s02_pcl.cpp, lang: cpp, muted: true, caption: "C++ with PCL",
            output: "{snippets.s02_pcl.cpp.output_line|nb}"}
    right: {kind: code, snippet: s02_python.py, lang: python, caption: "Python with Open3D",
            output: "{snippets.s02_python.py.output_line|nb}"}
    # footnote 6a (2026-10-14, speaker approved): why the counts differ (notes slide 2, grid anchoring)
    note: "Why do the counts differ? PCL and Open3D anchor the 0.5 m voxel grid differently; both average the points in each voxel."
    alt: "Two code blocks. Left, greyed out: loading a point cloud and voxel downsampling it with PCL in C++. Right: the same two operations in two lines of Python with Open3D."
    seconds: 35

  - n: 3
    build: meme
    section: Hook
    layout: 4
    transition: fade
    title: "A city scan: millions of points, no names"
    # 2026-10-14 (restructure): the problem, before the goal. Picture: the raw crop coloured by height (the render of
    # slide 14). The register is the BGT (slide 29); the question at the foot is answered on slide 29.
    image: {file: ../renders/f1_load.png,
            alt: "Bird's-eye render of the raw crop around the Jaarbeurs hall, coloured by height only: blue near the ground through sage to white on the roofs. Nothing says which point is a tree, a roof or a lamp post."}
    takeaway: "{pipeline.crop.points|int} points in one city block; none has a name."
    bullets:
      - "Each point: x, y, z and little else"
      - "Cities register what stands in the street: trees, lamp posts, bollards"
      - "Naming points by hand doesn't scale"
    note: "Today's question: does the scan agree with the register?"
    source: ahn
    seconds: 45

  - n: 4
    build: columns
    section: Hook
    layout: 4
    transition: fade
    title: "The goal: name every point, then check it"
    # 2026-10-13, speaker: what the goal is. Class 1 "overig" mixes vegetation, facades, cars and poles (AHN4
    # acquisition spec, research: reports/dataset.md). 2026-10-14 (restructure): input, output and how it is judged;
    # ground scored against AHN class 2, buildings against class 6 (results/pipeline.json), poles against the BGT
    # (slide 29); vegetation has no reference (slide 32)
    takeaway: "From x, y, z alone, in plain Python, and say how far to trust it."
    columns:
      - head: "In"
        items: ["One LAZ file, 200 m × 200 m", "x, y, z per laser echo"]
      - head: "Out"
        items: ["A class per point: ground, buildings, vegetation, street furniture"]
      - head: "Checked against"
        items: ["Ground, buildings: AHN's own classes", "Poles: the BGT register", "Vegetation: no reference"]
    alt: "Takeaway: from x, y, z alone, in plain Python, and say how far to trust it. Three columns. In: one LAZ file, 200 m by 200 m, x, y, z per laser echo. Out: a class per point: ground, buildings, vegetation, street furniture. Checked against: AHN's own classes for ground and buildings; the BGT register for poles; vegetation has no reference."
    seconds: 40

  - n: 5
    build: agenda
    section: Hook
    layout: 4
    transition: fade
    title: "Eight chapters, three questions"
    # 2026-10-14 (restructure): the agenda. Chapters exactly as meta.chapters (the footer breadcrumb, which marks
    # "you are here" on every slide); minutes from the seconds per chapter (docs/TIMING.md); Rule: where each rule
    # is proven (the badges top right)
    table:
      columns: ["Chapter", "What you get", "Rule", "Min"]
      rows:
        - ["Intro", "The problem, the goal, this map", "", "3"]
        - ["Data", "How a plane scans; the case; the scope", "", "3"]
        - ["Toolbox", "Four rules; a library for every layer", "", "2"]
        - ["Pipeline", "Six steps from LAZ file to labels", "1, 2", "8"]
        - ["Memory", "Does it fit? A full AHN sheet", "2", "2"]
        - ["Speed", "Is it fast? A loop against one call", "3", "5"]
        - ["Reality", "Is it right? The register against the scan", "4", "1"]
        - ["Wrap-up", "The rules in numbers; limits; next", "", "3"]
    alt: "Agenda table with four columns: chapter, what you get, the rule it proves, minutes. Intro: the problem, the goal, this map, 3 minutes. Data: how a plane scans, the case, the scope, 3. Toolbox: four rules and a library for every layer, 2. Pipeline: six steps from LAZ file to labels, proves rules 1 and 2, 8. Memory: does it fit, a full AHN sheet, rule 2, 2. Speed: is it fast, a loop against one call, rule 3, 5. Reality: is it right, the register against the scan, rule 4, 1. Wrap-up: the rules in numbers, limits, next, 3."
    seconds: 40

  - n: 6
    build: concept
    section: Data
    layout: 4
    transition: fade
    title: "A plane sweeps a strip with a laser"
    # 2026-10-13, speaker: how the data is gathered (a plane? one spot?). Figure and numbers: deck/concepts/
    # make_figures.py acquisition(), from the crop (results/concepts.json acq); the principle (time of flight, GNSS,
    # IMU) is general airborne laser scanning, no numbers. 2026-10-14 (restructure): before the data set; the inset
    # shows the strip from above; the last bullet plants slide 29 (61 poles, 3 found)
    figure: {file: a1_acquisition.png, caption: "Schematic side view, inset from above; not to scale.",
             alt: "Schematic side view: a plane flies over a street; laser rays fan out below it. One ray hits the ground, one passes a leaf-off tree and leaves three echoes on the way down, one hits a pole, two hit a flat roof; the building's wall is hardly hit. Labels: GNSS, where the plane is; IMU, how it is tilted; each dot is one point, x, y, z from range and position. Inset top left, from above: the flight line, and the strip the scanner sweeps in a zigzag."}
    takeaway: "x, y, z = range + GNSS position + IMU tilt."
    bullets:
      - "A scanning laser, not one spot: it sweeps a strip"
      - "One pulse can leave up to {concept.acq.max_returns|int} echoes, in trees most"
      - "Roofs dense, walls sparse, thin poles often missed"
      - "This crop: {concept.acq.pulses|int} pulses in {concept.acq.seconds|s1} of flight"
    alt: "Schematic of airborne laser scanning, with four bullets: a scanning laser, not one spot, it sweeps a strip; one pulse can leave up to {concept.acq.max_returns|int} echoes, in trees most; roofs are dense, walls sparse, and thin poles often missed; this crop is {concept.acq.pulses|int} pulses in {concept.acq.seconds|s1} of flight."
    seconds: 55

  - n: 7
    build: split_renders
    section: Data
    layout: 4            # Title and content, body replaced by two render frames
    transition: fade
    title: "Today's case: the block around the Jaarbeurs"
    # 2026-10-12: the slide proposes the running example of the whole talk and states the data set's specification
    # (speaker's request): a spec table right of the two frames (build_deck.py slide_split_renders `specs`). Values:
    # data/README.md and the crop's LAS header; density = 722 961 points / 40 000 m2 = 18.1 per m2; flown: GPS time
    # of the crop, 5 April 2023 about 23:51 UTC (data/README.md); file size: data/README.md (4 336 320 B).
    specs:
      heading: "The data set"
      rows:
        - ["Area", "200 m × 200 m"]
        - ["Points", "{pipeline.crop.points|int}"]
        - ["Density", "about 18 per m²"]
        - ["Source", "AHN5, ahn.nl"]
        - ["Flown", "April 2023, night"]
        - ["File", "LAZ, 4.3 MB"]
        - ["Coordinates", "RD New + NAP"]
        - ["Licence", "CC BY 4.0"]
      alt: "Specification of the data set: area 200 m by 200 m; {pipeline.crop.points|int} points, about 18 per square metre; source AHN5 from ahn.nl; flown in April 2023, at night; a 4.3 MB LAZ file; coordinates in RD New with NAP heights; licence CC BY 4.0."
    # Two portrait frames side by side (same camera, same scale as slides 16 to 22): f1 raw | f6 labelled.
    # hook_split.png (one wide split frame) is kept as an alternative but made the hall too small.
    visual:
      kind: side_by_side
      files: [f1_load.png, f6_final.png]
      frame: l7
      arrow: "→"
      alts:
        - "Bird's-eye render of the Jaarbeurs hall in Utrecht and the streets, trees and buildings around it, coloured by height from blue near the ground through sage to white on the roofs."
        - "The same view with our labels: ground slate grey, buildings light blue, vegetation sage green, street furniture white."
    # no label chips since 2026-10-12: with the data set table beside them the frames are about 2.5 in wide, too
    # small for four 20 pt chips; the classes are named in the support line and labelled from slide 20 on
    # The arrow points at the roof of the Jaarbeurs hall (BAG pand 0344100000077882, Jaarbeursplein 6), which lies
    # inside the crop: pixel from renders/labels.json f1_load.jaarbeurs_hall (pipeline/render.py jaarbeurs_hall)
    edge_arrow: {text: "Jaarbeurs hall", anchor: "f1_load.jaarbeurs_hall",
                 descr: "Arrow pointing down at the roof of the Jaarbeurs hall"}   # arrow on the LEFT frame
    # no split captions: the brief's ~20 words of body text (QA final round); the label chips and the arrows carry it
    note: "Checked against AHN (ground, buildings) and the BGT pole register (street furniture)."   # vegetation has no reference (slide 32)
    source: ahn
    # alt text: one per frame in visual.alts (no slide-level alt)
    seconds: 45

  - n: 8
    build: concept
    concept: C1      # figure, bullets and notes: deck/appendix.yaml entry C1 (promoted from the hidden Mental models section, 2026-10-12)
    section: Data
    layout: 4
    transition: fade   # no rule badge: it comes before the rules (slide 10)
    title: "One object, three representations"
    seconds: 40

  - n: 9
    build: columns
    section: Data
    layout: 4
    transition: fade
    title: "What this talk does, and doesn't"
    # 2026-10-14 (restructure): scope and assumptions, after the data set so the terms are known. Values from
    # pipeline/run.py and results/pipeline.json params (voxel, tile, ransac_threshold, low_prefilter, eps,
    # min_points, cluster_min_height_m); "tuned on this crop" is the speaker's statement (brief, 2026-10-14)
    pt: 20
    columns:
      - head: "In scope"
        items: ["Airborne LiDAR, AHN5", "One 200 m × 200 m urban crop", "Four classes, rule-based", "Standard Python libraries", "Speed and memory"]
      - head: "Not today"
        items: ["Deep learning, trained models", "Mobile or terrestrial scans", "Meshes, registration", "CRS in depth, production", "State-of-the-art accuracy"]
      - head: "Assumptions"
        items: ["Metres: RD New + NAP", "Ground: one plane per 25 m tile", "Voxel 0.5 m; inliers 0.4 m; objects > 0.3 m", "DBSCAN eps 0.75 m, 6 points", "Thresholds tuned on this crop"]
    alt: "Scope in three columns. In scope: airborne LiDAR from AHN5; one 200 by 200 metre urban crop; four classes, rule-based; standard Python libraries; speed and memory. Not today: deep learning and trained models; mobile or terrestrial scans; meshes and registration of several scans; coordinate reference systems in depth and production deployment; claims of state-of-the-art accuracy. Assumptions: metric coordinates, RD New plus NAP; ground is one plane per 25 metre tile; voxel 0.5 metres, plane inliers within 0.4 metres, objects more than 0.3 metres above ground; DBSCAN eps 0.75 metres with at least 6 points; thresholds tuned on this crop, so results hold for this crop only."
    seconds: 40

  - n: 10
    build: rules
    section: Toolbox
    layout: 4
    transition: fade
    title: "Four rules this talk will prove"
    # 2026-10-12, speaker: tips at the start and the end to build a mental model; keep it simple. Four rules, one
    # line each; the closing slide (build: rules, evidence: true) brings the same four back with the talk's numbers.
    rules:
      # 2026-10-14 (Phase 3): numbered in the order the talk first proves them; same order on the badges and slide 29
      - {head: "Think in arrays, not points", text: "A point cloud is an N×3 table plus attribute columns.", ref: "Proof: Pipeline"}
      - {head: "Make it small first", text: "Crop, tile and downsample; scale up last.", ref: "Proof: Pipeline, Memory"}
      - {head: "Let compiled code loop", text: "One call per array or tile, never per point.", ref: "Proof: Speed"}
      - {head: "Look before you compute", text: "Render it; check units, coordinates and classes.", ref: "Proof: Reality"}
    alt: "Four tiles, one rule of thumb each. 1 Think in arrays, not points: a point cloud is an N by 3 table plus attribute columns. 2 Make it small first: crop, tile and downsample; scale up last. 3 Let compiled code loop: one call per array or tile, never per point. 4 Look before you compute: render it; check units, coordinates and classes. Each tile names the part of the talk that proves it: Pipeline; Pipeline and Memory; Speed; Reality."
    seconds: 30

  - n: 11
    build: logo_wall
    section: Toolbox
    layout: 4
    transition: fade
    title: "Python already has a library for every layer"
    # One row per layer of a point cloud project (the yt talk's layers: files, arrays, algorithms, views), and a row of
    # models. 2026-10-12 relevance pass (speaker: every library on the wall must be relevant to the talk): kept are
    # the libraries the pipeline uses (used: true, blue outline) and those the talk or its backups name: PDAL and
    # pyproj (AHN files and RD New coordinates, slide 9), Numba (B1), Dask (scaling past RAM, slide 30),
    # trimesh and PyTorch3D (the wall only; slide 13 shows the pipeline libraries alone), scikit-learn (B5), VTK (under PyVista). Dropped: Potree,
    # CloudCompare and QGIS (not Python), GDAL (rasters), OpenCV, COLMAP and nerfstudio (images and photogrammetry),
    # Matplotlib (not used), PyG and Pointcept (deep learning on graphs and point clouds, not covered). The rest is in
    # docs/ECOSYSTEM.md. Every id resolves in deck/ecosystem/ecosystem.yaml (checked against PyPI and GitHub on
    # 2026-10-11); logos are shown unaltered; terms per file: deck/assets/logos/SOURCES.md.
    wall:
      rows:
        - {label: "Load and store", ids: [{id: laspy, used: true}, {id: pdal, caption: true, name: PDAL}, {id: pyproj, caption: true}]}
        - {label: "Arrays and speed", ids: [{id: numpy, used: true}, {id: scipy, caption: true, used: true}, {id: numba, caption: true}, dask]}
        - {label: "Process", ids: [{id: open3d, used: true}, trimesh]}
        - {label: "Visualise", ids: [{id: pyvista, used: true}, vtk]}
        - {label: "Learn", ids: [{id: scikit-learn, caption: true}, pytorch3d]}
    alt: "Ecosystem wall in five rows of logos; the five used in this talk's pipeline have a blue outline. Load and store: laspy (used), PDAL, pyproj. Arrays and speed: NumPy (used), SciPy (used), Numba, Dask. Process: Open3D (used), trimesh. Visualise: PyVista (used), VTK. Learn: scikit-learn, PyTorch3D."
    seconds: 35

  - n: 12
    build: meme
    section: Toolbox
    layout: 4            # Title and content, body replaced by one picture
    transition: fade
    title: "Python plans; compiled code does the work"
    # 2026-10-12 (speaker): the unmasking meme opens the Python-against-C++ comparison. The template is the Scooby-Doo
    # scene; the Python logo sits on the hooded head, the C++ logo on the unmasked one (logos from Wikimedia Commons,
    # shown unaltered apart from scaling). 30 s taken from the former slide 4 (now 5), so every later clock time holds. 2026-10-12 (later): moved behind the code
    # comparison, which shows the C++ is still there underneath, and NumPy added to the explanation.
    image: {file: assets/meme/python_cpp_unmasking.png,
            alt: "Scooby-Doo unmasking meme. Top: Fred touches the hood of a tied-up ghost whose head is the Python logo. Bottom: the unmasked figure's head is the C++ logo. Caption: Let's see who's really behind the mask."}
    takeaway: "Every call you make here runs compiled code"
    bullets:
      - "NumPy: a compiled C core, with some C++"
      - "Open3D: C++, wrapped for Python"
      - "PyVista: VTK, which is C++"
      - "laspy: the lazrs decoder is Rust"
    seconds: 35

  - n: 13
    build: filmstrip
    section: Pipeline
    layout: 4
    transition: fade
    title: "Six steps: from LAZ file to labels"
    visual:
      kind: filmstrip
      frames: [f1_load.png, f2_voxel.png, f3_ground.png, f4_clusters.png, f5_labels.png, f6_final.png]
      names: ["Load", "Voxel downsampling", "Ground removal", "Clustering", "Labelling", "Paint-back"]
      tags: ["laspy", "Open3D", "Open3D", "Open3D, SciPy", "NumPy, SciPy", "SciPy, PyVista"]
    source: ahn          # the thumbnails are AHN renders (CONTRACTS.md, data/DATA_LICENSE.md)
    alt: "Six thumbnails of the same area from the same camera, one per pipeline step: load, voxel downsampling, ground removal, clustering, labelling, paint-back."
    seconds: 40

  # Slides 12 to 18: one step each (code left, render right; 13 is the copy-or-view hand-off of step 1); 19 sums them up

  - n: 14
    build: load_stack
    section: Pipeline
    layout: 4
    rule: [1]
    step: 1          # step tracker top right (2026-10-13 restructure): slides 12 to 18
    transition: fade
    title: "1 Load: subtract a local origin first"
    code: {snippet: s08_load.py}
    visual: {kind: render, file: f1_load.png}
    figure: {file: f1_load_origin.png, alt: "The crop's points 135914.6 m from the origin, then after subtracting header.mins: near zero. float32 step 1.6 cm becomes 15 µm."}
    takeaway: "laspy hands you NumPy; a local origin keeps float32 precise."   # 2026-10-13: the slide's message, big (slide_load_stack)
    source: ahn
    alt: "The crop as a point cloud, coloured by height: the hall roof white, the ground blue."
    # 2026-10-12, speaker: a simple visualisation per step: a small navy sketch in the render's top-right corner
    # (deck/lib/sketches.py; the label chips keep clear of it). Load: the first point's x in RD and after
    # subtracting header.mins, with float32's step at each size (np.spacing(np.float32(v)): 0.015625 m at
    # 135 914.6, 1.53e-5 m at 199.6; the RD step is the research token used in the notes)
    seconds: 55

  - n: 15
    build: handoffs
    section: Pipeline
    layout: 4
    rule: [1]
    step: 1          # still step 1: the hand-offs of the load
    transition: fade
    title: "1 Load: pass views, not copies"
    # Four hand-offs of the pipeline, in order (laspy -> NumPy -> Open3D -> NumPy -> PyVista). Every verdict is a
    # check in bench/python_facts.py (results/python_facts.json); `verify` names the boolean that must hold for the
    # verdict shown (the build warns otherwise). snippets/s06b_handoffs.py runs the same four calls with asserts.
    # 2026-10-12, speaker: explain the difference and why it matters: a two-panel legend above the rows (copy: two
    # blocks of memory; view: two names on one block) and the consequence as the support line.
