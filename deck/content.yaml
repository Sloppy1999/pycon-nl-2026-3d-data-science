  - n: 7
    build: workflow
    section: Hook
    layout: 4
    transition: fade
    title: "A 3D project moves through six stages"
    # 2026-10-13, speaker: replaces the trade-offs slide with the typical workflow of a 3D data scientist, simplified from
    # the six-stage view of the book "3D Data Science with Python" (Figure 1-12): preparation = pre-processing and
    # registration; exploration = modelling, semantics, structure; analysis = measurements, optimisation, monitoring.
    # Later the same day the chain slide (laspy, NumPy, Open3D, PyVista with an image each) was merged in: the tools sit
    # under their stage, three of the pipeline's renders beside them (the slide's 80 s moved here; talk total unchanged).
    # Ring, clockwise; disc colour = phase: navy gets the data, blue understands it, sage delivers it. The pipeline
    # covers stages 1 to 5 in miniature: laspy loads (1), Open3D voxels and ground (2) and clusters (3), NumPy and SciPy
    # label and measure (3, 4), PyVista draws (5). NumPy holds the array between every step (said in the notes).
    stages:
      - {head: "Acquisition", text: "Scan the scene", tools: "laspy", tone: navy,
         image: {file: closeup.png, alt: "Close-up render of the crop: single points as laspy reads them."}}
      - {head: "Preparation", text: "Clean and register", tools: "NumPy, Open3D", tone: navy}
      - {head: "Exploration", text: "Model and label", tools: "Open3D, SciPy", tone: blue,
         image: {file: f4_clusters.png, alt: "The clusters render: ground grey, each cluster in one of four colours."}}
      - {head: "Analysis", text: "Measure, monitor", tools: "NumPy, SciPy", tone: blue}
      - {head: "Visualisation", text: "See it, trust it", tools: "PyVista", tone: sage,
         image: {file: f6_final.png, alt: "The final render: ground, buildings, vegetation and street furniture."}}
      - {head: "Application", text: "Ship it", tone: sage}
    loops: [[4, 2], [5, 1]]      # analysis back to preparation, visualisation back to acquisition (dashed, through the middle)
    centre: "Loop back when the data surprises"
    source: ahn
    alt: "A ring of six numbered stages, clockwise, with the Python libraries under each. 1 Acquisition, scan the scene, laspy, with a close-up of single points as laspy reads them; 2 Preparation, clean and register, NumPy and Open3D; 3 Exploration, model and label, Open3D and SciPy, with the clustered point cloud; 4 Analysis, measure, monitor, NumPy and SciPy; 5 Visualisation, see it, trust it, PyVista, with the final labelled render; 6 Application, ship it. Stages 1 and 2 are coloured as data, 3 and 4 as understanding, 5 and 6 as delivery. Dashed arrows through the middle lead from analysis back to preparation and from visualisation back to acquisition: loop back when the data surprises you."
    seconds: 145

  - n: 8
    build: rules
    section: Hook
    layout: 4
    transition: fade
    title: "Four rules of thumb for 3D data"
    # 2026-10-12, speaker: tips at the start and the end to build a mental model; keep it simple. Four rules, one
    # line each; the closing slide (build: rules, evidence: true) brings the same four back with the talk's numbers.
    rules:
      - {head: "Think in arrays, not points", text: "A point cloud is an N×3 table plus attribute columns."}
      - {head: "Look before you compute", text: "Render it; check units, coordinates and classes."}
      - {head: "Make it small first", text: "Crop, tile and downsample; scale up last."}
      - {head: "Let compiled code loop", text: "One call per array or tile, never per point."}
    alt: "Four tiles, one rule of thumb each. 1 Think in arrays, not points: a point cloud is an N by 3 table plus attribute columns. 2 Look before you compute: render it; check units, coordinates and classes. 3 Make it small first: crop, tile and downsample; scale up last. 4 Let compiled code loop: one call per array or tile, never per point."
    seconds: 45

