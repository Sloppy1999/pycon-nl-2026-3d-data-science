[project]
name = "pycon-nl-2026-3d"
version = "0.1.0"
description = "3D Data Science with Python (PyCon NL 2026): pipeline, benchmarks, renders and deck builder"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "laspy[lazrs]>=2.7",
    "open3d>=0.20",
    "pyvista>=0.49",
    "trimesh>=5.1",
    "psutil>=7",
]

[dependency-groups]
deck = [
    "python-pptx>=1.0.2",
    "pyyaml>=6",
    "pygments>=2.19",
    "segno>=1.6",
    "lxml>=5",
    "defusedxml>=0.7",
    "pillow>=11",
]
ml = [
    "scikit-learn>=1.9.1",
]
profile = [
    "scalene>=2.3.0",
]

[tool.uv]
package = false
default-groups = ["deck"]
